name: Deploy to Cloudflare Pages

on:
  push:
    tags:
      - '*'

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on master branch
        run: |
          echo "Verifying if tag '${{ github.ref_name }}' (commit ${{ github.sha }}) belongs to branch 'master'..."
          git fetch origin master
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/master; then
            echo "::error::Tag '${{ github.ref_name }}' is not on branch 'master'. Aborting deployment."
            exit 1
          fi
          echo "Successfully verified: tag is on branch 'master'."

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification & tests
        run: pnpm test

      - name: Build production assets
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ secrets.CLOUDFLARE_PROJECT_NAME || 'wow-qol-forge' }} --branch=master --commit-dirty=true
